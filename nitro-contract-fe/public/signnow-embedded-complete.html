<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Returning to Nitro Advance</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #f8fafc;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <p>Returning to Nitro Advance…</p>
    <script>
      (function () {
        var payload = { source: "nitro-signnow-embedded", event: "complete" };
        var target = window.opener || window.parent;
        if (target && target !== window) {
          try {
            target.postMessage(payload, window.location.origin);
          } catch (e) {
            target.postMessage(payload, "*");
          }
        }
        if (window.opener) {
          window.close();
        }
      })();
    </script>
  </body>
</html>
